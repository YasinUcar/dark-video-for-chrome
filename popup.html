<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Video Karanlık Mod</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>🌙 Video Karanlık Mod</h1>
    <label class="switch">
      <input type="checkbox" id="globalEnabled">
      <span class="slider"></span>
    </label>
  </header>

  <section class="row">
    <label for="autoDetect">Otomatik algıla (açık arka planı bul)</label>
    <input type="checkbox" id="autoDetect">
  </section>

  <section class="row" id="thresholdRow">
    <label for="threshold">Hassasiyet: <span id="thresholdValue">140</span></label>
    <input type="range" id="threshold" min="60" max="220" step="5">
  </section>

  <section class="row modes">
    <label><input type="radio" name="mode" id="modeInvert"> Ters çevir (kod / ekran görüntüsü için)</label>
    <label><input type="radio" name="mode" id="modeDim"> Karart (renkli video için)</label>
  </section>

  <hr>

  <section class="row">
    <div class="site-label">Site: <span id="siteLabel">—</span></div>
    <button id="siteToggle">Bu sitede kapat</button>
  </section>

  <button id="pageForce" class="full-width">Bu sayfayı şimdi aç/kapat (Alt+Shift+D)</button>

  <p class="note">
    Not: YouTube gibi bazı sitelerde tarayıcı güvenliği nedeniyle otomatik algılama
    çalışmayabilir. Böyle durumlarda otomatik algılamayı kapatıp yukarıdaki kısayolu
    kullanabilirsin.
  </p>
</body>
<script src="popup.js"></script>
</html>
